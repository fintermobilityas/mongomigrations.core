name: mongomigrations.core

on:
  push:
  workflow_dispatch:
    inputs:
      auth_only:
        description: Verify NuGet trusted publishing without releasing
        required: false
        default: true
        type: boolean

env:
  GITVERSION_VERSION: 6.4.0
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1 

jobs:

  horizon-pins:
    name: Verify Horizon toolchain pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Horizon pins
        run: python3 .horizon/verify-pins.py

  setup:
    if: ${{ !inputs.auth_only }}
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      BUILD_VERSION: ${{ steps.set-version.outputs.BUILD_VERSION }}
      MONGODB_VERSION: ${{ steps.set-version.outputs.MONGODB_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - id: set-version
        name: Setup GitVersion and set build version
        shell: pwsh
        run: |
            dotnet tool update GitVersion.Tool --global --version ${{ env.GITVERSION_VERSION }}
            $BUILD_VERSION = (dotnet gitversion /showVariable semver) | out-string
            echo "BUILD_VERSION=$BUILD_VERSION" >> $env:GITHUB_OUTPUT
            $MONGODB_VERSION = ([xml](Get-Content Directory.Build.props)).SelectSingleNode("//MongoDBVersion").InnerText.Trim()
            echo "MONGODB_VERSION=$MONGODB_VERSION" >> $env:GITHUB_OUTPUT
    
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [setup]
    env:
      BUILD_VERSION: ${{ needs.setup.outputs.BUILD_VERSION }}
      MONGODB_VERSION: ${{ needs.setup.outputs.MONGODB_VERSION }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:      
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
 
      - if: matrix.os == 'ubuntu-latest'
        name: Setup mongodb v${{ env.MONGODB_VERSION }}
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ env.MONGODB_VERSION }}
                                    
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
                
      - name: Build & Run Tests
        shell: pwsh
        run: |
          pwsh -command ".\${{ env.GITHUB_WORKSPACE }}\build.ps1" -Version ${{ env.BUILD_VERSION }} -RunTests
        
  publish:
     if: success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
     runs-on: ubuntu-latest
     environment: nuget-publishing
     name: Publish nuget package
     needs: [setup, build]
     env:
      BUILD_VERSION: ${{ needs.setup.outputs.BUILD_VERSION }}
     permissions:
      contents: write
      id-token: write
     steps:      
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Nupkg        
        shell: pwsh
        run: |
          pwsh -command ".\${{ env.GITHUB_WORKSPACE }}\build.ps1" -Version ${{ env.BUILD_VERSION }} -Nupkg
          
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1 # Organization allow-list permits version tags only.
        with:
          user: petersunde

      - name: Push nuget packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |                             
          $nupkgs = Get-ChildItem ".\${{ env.GITHUB_WORKSPACE }}\nupkgs" -Filter *.nupkg | Select-Object -ExpandProperty FullName          
          $nupkgs | ForEach-Object {
            dotnet nuget push $_ --source nuget.org --api-key $env:NUGET_API_KEY
            if($LASTEXITCODE -ne 0) {
               Write-Error "Error uploading nupkg: $_. Exit code: $LASTEXITCODE"
            }
          }          

      - name: Create github release tag
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ env.BUILD_VERSION }}
          draft: false
          prerelease: false

  verify-nuget-auth:
    name: Verify NuGet trusted publishing
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_only }}
    runs-on: ubuntu-latest
    environment: nuget-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1 # Organization allow-list permits version tags only.
        with:
          user: petersunde
      - name: Verify temporary credential issuance
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          echo "NuGet trusted publishing issued a temporary credential."
