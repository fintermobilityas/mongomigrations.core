version: 2
updates:
- package-ecosystem: nuget
  cooldown:
    default-days: 3
  directory: "/"
  schedule:
    interval: daily
    time: "05:00"
  groups:
    MongoDB:
      patterns:
        - "MongoDB.Bson"
        - "MongoDB.Driver"
- package-ecosystem: "github-actions"
  cooldown:
    default-days: 3
  directory: "/"
  schedule:
    interval: "daily"
    time: "05:00"
